<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Wargaming Winter Gathering</title>
<style>
  :root { color-scheme: light dark; --bg:#0e1116; --fg:#f4f5f7; --muted:#9aa1ad;
           --card:#161b22; --line:#262d38; --accent:#f4f5f7; --accent-fg:#0e1116; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --fg:#14171c; --muted:#5b6472; --card:#fff; --line:#e3e6ea;
             --accent:#14171c; --accent-fg:#fff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 16px; background:var(--bg); color:var(--fg);
         font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:26rem; margin:0 auto; text-align:center; }
  h1 { font-size:1.5rem; line-height:1.25; margin:0 0 .25rem; letter-spacing:-.02em; }
  .sub { color:var(--muted); margin:0 0 1.8rem; font-size:.95rem; }
  .qr { background:#fff; border-radius:16px; padding:22px; display:inline-block; }
  .qr img { display:block; width:230px; height:230px; }
  .code { font:600 1.05rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;
           letter-spacing:.14em; margin:1.3rem 0 .4rem; }
  .hint { color:var(--muted); font-size:.85rem; margin:0 0 1.8rem; }
  .dl { display:flex; gap:10px; justify-content:center; }
  .dl a { flex:1; max-width:11rem; text-decoration:none; border-radius:11px;
           padding:12px 16px; font-size:.95rem; font-weight:600;
           border:1px solid var(--line); color:var(--fg); background:var(--card); }
  .dl a.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
</style>
<main>

  <div class="qr"><img src="WGWG-0446-YSW5R6.svg" alt="QR code WGWG-0446-YSW5R6"></div>

  <p class="code">WGWG-0446-YSW5R6</p>
  <p class="hint">Save it to your phone or print it. Show at the entrance.</p>

  <div class="dl">
    <a class="primary" href="WGWG-0446-YSW5R6.svg" download>Download SVG</a>
    <a href="WGWG-0446-YSW5R6.png" download>PNG</a>
  </div>
</main>
</html>
